name: "Close stale PRs"
description: "Common stale PRs action for all osbuild repositories"

inputs:
  token:
    description: "A GitHub token for marking stale PRs and closing them"
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/stale@v9
      with:
        repo-token: "${{ inputs.TOKEN }}"
        # PR stale settings
        stale-pr-message: 'This PR is stale because it had no activity for the past 30 days. Remove the "Stale" label or add a comment, otherwise this PR will be closed in 7 days.'
        close-pr-message: 'This PR was closed because it has been stalled for 30+7 days with no activity.'
        days-before-pr-stale: 30
        days-before-pr-close: 7
        # Issue stale settings
        stale-issue-message: 'This issue is stale because it had no activity for the past 365 days. Remove the "Stale" label or add a comment, otherwise this issue will be closed in 30 days.'
        close-issue-message: 'This issue was closed because it has been stalled for 365+30 days with no activity.'
        days-before-issue-stale: 365
        days-before-issue-close: 30
        # Operations limit is used for issues and PRs, even if issues are not touched
        operations-per-run: 500
